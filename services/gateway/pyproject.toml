[project]
name = "homepi-gateway"
version = "0.1.0"
description = "HomePI-Gateway: laedt die Artefakt-Module und stellt sie unter einer API bereit"
requires-python = ">=3.12"
dependencies = [
    "homepi-core",
    # Die Artefakte. Jedes meldet sich ueber einen Entry Point an und wird
    # beim Start automatisch eingehaengt - hier steht nur, dass es mitkommt.
    "homepi-geraete",
    # Ohne dieses Artefakt kann niemand Konten anlegen oder Rechte vergeben.
    # Es gehoert damit zum Gateway wie die Anmeldung selbst.
    "homepi-verwaltung",
]

[tool.homepi]
service = "gateway"
stack = "apps"

[tool.uv.sources]
homepi-core = { path = "../../packages/homepi-core", editable = true }
homepi-geraete = { path = "../../modules/geraete", editable = true }
homepi-verwaltung = { path = "../../modules/verwaltung", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homepi_gateway"]

[dependency-groups]
dev = [
    "homepi-core[test]",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-watcher>=0.4",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config -m 'not integration and not smoke'"
markers = [
    "integration: braucht eine echte Postgres-Instanz",
    "smoke: spricht mit einer laufenden Instanz",
]

# Die Schwelle steht beim Projekt, nicht in der CI - so gilt sie auch
# lokal und muss beim Anlegen eines Artefakts nirgends nachgetragen werden.
[tool.coverage.report]
fail_under = 90

[tool.coverage.run]
source = ["homepi_gateway"]
branch = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["homepi_gateway"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
