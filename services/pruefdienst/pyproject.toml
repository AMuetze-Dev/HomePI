[project]
name = "homepi-pruefdienst"
version = "0.1.0"
description = "HomePI-Pruefdienst: liest DFBnet und spielt in das Artefakt staffelpilot ein"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "playwright>=1.49",
    # Zum Lesen der Spielberichtsseiten. lxml, weil der uebernommene Extraktor
    # damit geprueft ist - ein anderer Parser bricht Zeilen anders um, und die
    # Golden-Tests haengen an dem, was dort steht.
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    # Fuer den Schalter, der einzelne Regeln stilllegt. Eine abgeschaltete
    # Regel steht in einer YAML-Datei neben den Regeln -- nicht in der
    # Regeldatei selbst, die gehoert dem Staffelleiter.
    "pyyaml>=6.0",
]

[tool.homepi]
service = "pruefdienst"
stack = "apps"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homepi_pruefdienst"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"

# Die Schwelle steht beim Projekt, nicht in der CI - so gilt sie auch lokal.
[tool.coverage.report]
fail_under = 90

[tool.coverage.run]
source = ["homepi_pruefdienst"]
branch = true
# Ausgenommen, was nur mit einem echten Browser beziehungsweise einem echten
# Prozess laeuft. Beides ist von hier aus nicht pruefbar, und eine Zahl, die
# so tut, waere schlimmer als die ehrliche Luecke.
#
# `bericht.py` ist der dritte Fall und ein anderer: woertlich uebernommen und
# durch Golden-Tests gegen echtes, aufgezeichnetes DFBnet-HTML gehalten. Dabei
# kommt er auf **70 %** (539 Anweisungen, 126 ungedeckt). Was fehlt, sind
# Zweige fuer Auszeichnungsvarianten, von denen hier keine Aufnahme existiert
# -- sie mit selbst erfundenem HTML anzufahren hiesse, die eigene Erfindung zu
# pruefen und nicht DFBnet. Die Zahl steht hier, damit sie kein Versteck wird.
#
# Die Schwelle von 90 % gilt damit fuer das, was wir selbst geschrieben haben.
omit = ["*/dfbnet.py", "*/__main__.py", "*/bericht.py", "*/regelwerk/vorlagen/*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"
# Die Regeldateien des Staffelleiters. Sie werden nicht importiert, sondern
# mit einem gestellten Namensraum ausgefuehrt: `regel`, `melde`, `ANZAHL` und
# die Datumshilfen sind dort einfach da. Fuer ruff sind das lauter undefinierte
# Namen -- und formatieren darf er sie schon gar nicht: sie gehoeren dem
# Staffelleiter, der sie von Hand aendert.
extend-exclude = ["src/homepi_pruefdienst/regelwerk/vorlagen"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
# Die uebernommenen Regeltests. Dieselbe Begruendung wie beim Regelwerk
# selbst: sie sind woertlich uebernommen, und die deutsche Typografie in den
# Paragrafenzitaten ist dort Absicht.
"tests/unit/regelwerk/**" = ["E501", "RUF002", "RUF005", "RUF015"]
# Ebenfalls uebernommen: die Tests der Feldauswahl.
"tests/unit/test_auswahl.py" = ["E501", "RUF002", "RUF012"]
# Woertlich uebernommen aus der bestehenden Anwendung und dort ueber eine
# Saison an echten Seiten gewachsen. Ihn nach unserem Geschmack umzuformen
# hiesse, jede Zeile anzufassen, die sich bewaehrt hat -- und der Vergleich
# mit dem Original waere danach keiner mehr.
"src/homepi_pruefdienst/bericht.py" = ["E741", "RUF001"]
# Dasselbe fuer das uebernommene Regelwerk: die deutschen Anfuehrungszeichen
# und Gedankenstriche in den Paragrafenzitaten sind dort Absicht.
"src/homepi_pruefdienst/regelwerk/*.py" = ["RUF001", "RUF002", "RUF003", "SIM103"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["homepi_pruefdienst"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Derselbe Grund wie oben bei ruff: woertlich uebernommen. Er wird nicht
# durchtypisiert, sondern durch die Golden-Tests gegen echtes DFBnet-HTML
# gehalten -- das ist die Pruefung, auf die es bei ihm ankommt.
[[tool.mypy.overrides]]
module = "homepi_pruefdienst.bericht"
ignore_errors = true

# Und dasselbe fuer das Regelwerk. Es ist woertlich uebernommen und wird von
# den ebenfalls uebernommenen Tests gehalten (tests/unit/regelwerk/). Es
# durchzutypisieren hiesse, 1700 Zeilen anzufassen, die sich ueber eine Saison
# bewaehrt haben -- das ist eine eigene Arbeit und keine Nebenwirkung des
# Umzugs.
[[tool.mypy.overrides]]
module = "homepi_pruefdienst.regelwerk.*"
ignore_errors = true
