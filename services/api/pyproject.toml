[project]
name = "homepi-api"
version = "0.1.0"
description = "Backend der HomePI-Anwendung"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-watcher>=0.4",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homepi_api"]

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
# Bewusst OHNE --cov: im Watch-Modus soll ein einzelner Test in Millisekunden
# durchlaufen und nicht an einer Coverage-Schwelle scheitern. Die Schwelle
# setzen Makefile und CI ueber "make test-api".
# Integrationstests brauchen Postgres und laufen nur, wenn ausdruecklich
# angefordert: pytest -m integration
addopts = "-q --strict-markers --strict-config -m 'not integration'"
markers = [
    "integration: braucht eine echte Postgres-Instanz (DATABASE_URL)",
]

[tool.coverage.run]
source = ["homepi_api"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # Import-Sortierung
    "UP",            # veraltete Syntax
    "B",             # haeufige Fehlerquellen (bugbear)
    "SIM",           # Vereinfachungen
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests duerfen assert und lange Zeilen
"tests/**" = ["E501"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["homepi_api"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
# Tests brauchen keine vollstaendigen Annotationen, sonst wird TDD zaeh
disallow_untyped_defs = false
