# Ziel: höchstens vier Pull Requests im Monat, nicht zwanzig.
#
# Die Standardwerte von Dependabot (fünf offene PRs je Ökosystem, wöchentlich,
# ein PR je Abhängigkeit) erzeugen in einem Repo dieser Größe mehr Rauschen als
# Nutzen. Deshalb: alles gruppiert, monatlich, und Major-Updates werden gar
# nicht vorgeschlagen - die will man lesen und von Hand machen, nicht mergen.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directories:
      - "/services/api"
      - "/packages/homepi-core"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(python)"
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Major-Updates von Pydantic, SQLAlchemy oder FastAPI ändern Verhalten.
      # Die gehören in einen eigenen Branch mit gelesenen Release Notes.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/services/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(web)"
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directories:
      - "/services/api"
      - "/services/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(docker)"
    groups:
      basis-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # python:3.14 oder node:26 sind bewusste Entscheidungen, keine Updates.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
