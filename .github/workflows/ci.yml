name: CI

# Laeuft auf jedem Feature-Branch, nicht erst im Pull Request. Ein roter Test
# soll innerhalb von Minuten sichtbar sein, nicht erst beim Merge.
on:
  push:
    branches: [develop, main, "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Nur bauen, was sich geaendert hat. Eine Aenderung an docs/ soll nicht
  # zehn Minuten CI ausloesen.
  changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
      python: ${{ steps.filter.outputs.python }}
      projekte: ${{ steps.projekte.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'packages/**'
              - 'modules/**'
              - 'services/gateway/**'
              - '.github/workflows/ci.yml'
            gateway:
              - 'packages/**'
              - 'modules/**'
              - 'services/gateway/**'
              - '.github/workflows/ci.yml'
            web:
              - 'services/web/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'stacks/**'
              - 'scripts/**'
              - 'compose.dev.yml'
              - 'Makefile'
              - '.env.example'
              - '.github/workflows/ci.yml'

      # Die Python-Projekte werden gesucht, nicht aufgezaehlt: ein neues
      # Artefakt unter modules/ soll geprueft werden, ohne dass jemand daran
      # denkt, es hier nachzutragen.
      - name: Python-Projekte finden
        id: projekte
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          orte = [
              *sorted(Path().glob("packages/*/pyproject.toml")),
              *sorted(Path().glob("modules/*/pyproject.toml")),
              Path("services/gateway/pyproject.toml"),
          ]

          projekte = []
          for pyproject in orte:
              ordner = pyproject.parent
              pakete = [p.name for p in (ordner / "src").glob("homepi_*") if p.is_dir()]
              if not pakete:
                  continue
              projekte.append(
                  {
                      "name": ordner.name,
                      "pfad": ordner.as_posix(),
                      "paket": pakete[0],
                  }
              )

          print("matrix=" + json.dumps(projekte))
          PY

  # -------------------------------------------------------------------------
  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell-Skripte pruefen
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning scripts/*.sh stacks/data/initdb/*.sh

      - name: Skripte ohne CRLF
        # Ein einziges Carriage Return macht das Skript auf dem Pi unbrauchbar
        run: |
          if grep -rlU $'\r' scripts/ stacks/ Makefile 2>/dev/null | grep -q .; then
            echo "::error::CRLF gefunden - .gitattributes pruefen"
            grep -rlU $'\r' scripts/ stacks/ Makefile
            exit 1
          fi

      - name: Skripte sind ausfuehrbar
        # core.fileMode ist unter Windows aus - ein "chmod +x" landet dort nie
        # im Index. Ohne diese Pruefung faellt das erst auf, wenn der Pi das
        # Skript nicht starten kann, oder hier mit "Permission denied".
        run: |
          nicht_ausfuehrbar=$(git ls-files -s '*.sh' | awk '$1 != "100755" {print $4}')
          if [ -n "$nicht_ausfuehrbar" ]; then
            echo "::error::Diese Skripte sind nicht ausfuehrbar:"
            echo "$nicht_ausfuehrbar"
            echo "Beheben mit:  git update-index --chmod=+x <datei>"
            exit 1
          fi
          echo "Alle Skripte haben das Ausfuehrbar-Bit."

      - name: Workflows pruefen
        # Faengt Tippfehler in den Workflows, bevor sie einen Lauf kosten.
        # Achtung: bei einer Matrix aus fromJSON kennt actionlint die
        # Schluessel nicht - ein falscher matrix.<name> bleibt unentdeckt.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

      - name: Compose-Dateien validieren
        run: |
          cp .env.example .env
          ./scripts/40-render-config.sh
          for stack in core dns data home apps; do
            echo "--- $stack"
            docker compose --env-file .env -f "stacks/$stack/docker-compose.yml" config -q
          done
          echo "--- Entwicklungsumgebung"
          docker compose -f compose.dev.yml config -q

      - name: Keine Klartext-Geheimnisse in .env.example
        run: |
          if grep -Ev '^\s*#|^\s*$' .env.example | grep -Eiv "change-me|example\.com|^\w+='?(1000|Europe/Berlin|/srv/homelab|postgres|info)" \
             | grep -Ei "(password|token|secret)=" ; then
            echo "::error::.env.example enthaelt offenbar einen echten Wert"
            exit 1
          fi

  # -------------------------------------------------------------------------
  # Alle drei Python-Projekte in einer Matrix: derselbe Ablauf, andere
  # Verzeichnisse. Drei fast gleiche Jobs waeren drei Stellen zum Vergessen.
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projekt: ${{ fromJSON(needs.changes.outputs.projekte) }}

    defaults:
      run:
        working-directory: ${{ matrix.projekt.pfad }}

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://app:app@127.0.0.1:5432/test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.projekt.pfad }}/uv.lock

      - run: uv sync --frozen --all-extras

      # Reihenfolge ist Absicht: Format und Lint sind in Sekunden durch und
      # geben die praezisere Fehlermeldung als ein fehlgeschlagener Test.
      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Typen
        run: uv run mypy

      - name: Tests inklusive Integration
        # -m 'not smoke' hebt den Standardfilter auf: Postgres ist hier da,
        # eine laufende Instanz nicht.
        #
        # Ohne --cov-fail-under: die Schwelle steht als fail_under in der
        # pyproject.toml des Projekts und gilt damit auch lokal.
        run: |
          uv run pytest -m 'not smoke' \
            --cov=${{ matrix.projekt.paket }} --cov-report=term-missing --cov-report=xml \
            --junitxml=junit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testbericht-${{ matrix.projekt.name }}
          path: |
            ${{ matrix.projekt.pfad }}/junit.xml
            ${{ matrix.projekt.pfad }}/coverage.xml
          retention-days: 7

  # -------------------------------------------------------------------------
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/web/package-lock.json

      - run: npm ci

      - name: Format
        run: npx prettier --check src "./*.ts" "./*.js"

      - name: Lint
        run: npx eslint .

      - name: Typen
        run: npm run typecheck

      - name: Tests
        # Die Schwellen stehen in vite.config.ts und lassen den Lauf scheitern
        run: npm run test:coverage

      - name: Produktionsbuild
        run: npm run build

  # -------------------------------------------------------------------------
  # Der eigentliche Beweis, dass alles zusammenpasst: die komplette
  # Entwicklungsumgebung hochfahren und die Rauchtests dagegen laufen lassen.
  # Genau diese Tests laufen spaeter gegen den Pi, nur mit anderer Basis-URL.
  stack:
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      # Wegwerfkonto in einer Datenbank, die am Ende des Jobs geloescht wird.
      # Kein Secret: es schuetzt nichts, was den Lauf ueberlebt.
      HOMEPI_SMOKE_BENUTZER: rauchtest
      HOMEPI_SMOKE_PASSWORT: rauchtest-nur-fuer-die-ci-4711
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/gateway/uv.lock

      - name: Entwicklungsumgebung hochfahren
        run: docker compose -f compose.dev.yml up -d --build --wait --wait-timeout 300

      - name: Konto fuer die Rauchtests anlegen
        # Artefakte sind je Benutzer sichtbar. Ohne Konto waere das Manifest
        # berechtigterweise leer und die Rauchtests wuerden nichts mehr pruefen.
        # Das Passwort kommt ueber stdin, nicht als Argument - sonst stuende es
        # in der Prozessliste des Runners.
        run: |
          printf '%s' "$HOMEPI_SMOKE_PASSWORT" \
            | docker compose -f compose.dev.yml exec -T -w /app/services/gateway gateway \
                uv run homepi benutzer anlegen rauchtest --passwort-stdin \
                --artefakt geraete --rolle verwalter

      - name: Rauchtests gegen die laufende Instanz
        working-directory: services/gateway
        run: |
          uv sync --frozen --all-extras
          uv run pytest -m smoke -v
        env:
          HOMEPI_BASIS_URL: http://127.0.0.1:18000

      - name: Frontend liefert aus und erreicht die API
        run: |
          curl -sf http://127.0.0.1:5173/ >/dev/null
          # Der Vite-Proxy ist der Weg, den auch der Browser nimmt. Ohne
          # Anmeldung ist die Liste leer - dass sie ueberhaupt ankommt, ist
          # hier die Frage; was drinsteht, pruefen die Rauchtests.
          curl -sf http://127.0.0.1:5173/api/module | grep -q '^\['

      - name: Logs bei Fehlschlag
        if: failure()
        run: docker compose -f compose.dev.yml logs --tail 100

      - name: Abbauen
        if: always()
        run: docker compose -f compose.dev.yml down -v

  # -------------------------------------------------------------------------
  # Faengt Dockerfile-Fehler frueh, ohne den langsamen arm64-Build. Der echte
  # Release-Build fuer den Pi laeuft in images.yml.
  docker:
    needs: changes
    if: needs.changes.outputs.gateway == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Das Gateway braucht die Repo-Wurzel als Kontext: packages/ und
          # modules/ liegen ausserhalb seines Verzeichnisses.
          - name: gateway
            context: .
            file: services/gateway/Dockerfile
          - name: web
            context: services/web
            file: services/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          load: true
          tags: probe-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Ein Image, das baut, aber nicht startet, ist kein gebautes Image.
      # Genau dieser Fall - venv an den falschen Pfad kopiert, Shebangs zeigen
      # ins Leere, "exec: uvicorn: not found" - ist hier schon durchgerutscht.
      - name: Startet das Image ueberhaupt?
        if: matrix.name == 'gateway'
        run: |
          docker run --rm -d --name probe -p 8000:8000 \
            -e SERVICE_NAME=gateway -e ENVIRONMENT=entwicklung \
            probe-gateway:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/info >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/info | grep -q '"geraete"'
          docker rm -f probe

  # -------------------------------------------------------------------------
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Nach Geheimnissen in der Historie suchen
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-banner --redact --verbose

  # -------------------------------------------------------------------------
  # Ein einziger Status fuer den Branch-Schutz. Ohne diesen Job muesste jeder
  # neue Job einzeln in den Einstellungen nachgetragen werden - und ein
  # uebersprungener Job wuerde faelschlich als Erfolg zaehlen.
  ci:
    needs: [infra, python, web, stack, docker, secrets]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Ergebnis auswerten
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"failure"'; then
            echo "::error::Mindestens ein Job ist fehlgeschlagen"
            exit 1
          fi
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"cancelled"'; then
            echo "::error::Mindestens ein Job wurde abgebrochen"
            exit 1
          fi
          echo "Alles gruen (uebersprungene Jobs sind in Ordnung)."
