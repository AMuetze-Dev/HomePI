[project]
name = "homepi-core"
version = "0.1.0"
description = "Grundgerüst für HomePI-Microservices: Konfiguration, Logging, Health, Fehlerformat, Deploy-CLI"
requires-python = ">=3.12"
readme = "README.md"

# Bewusst schlank gehalten. Die CLI kommt mit argparse aus der Standard-
# bibliothek aus - ein Service, der nur deployen will, zieht sich kein Typer
# und kein Click herein.
dependencies = [
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "argon2-cffi>=25.1.0",
]

[project.optional-dependencies]
# Nur Services, die wirklich einen Cache brauchen.
cache = ["redis>=5.2"]
# Rauchtests gegen eine laufende Instanz (homepi_core.testing).
test = ["httpx>=0.28", "pytest>=8.3", "pytest-asyncio>=0.25"]

[project.scripts]
homepi = "homepi_core.cli.main:main"

[project.entry-points.pytest11]
# Damit stehen die Fixtures "ziel" und "smoke_client" in jedem Projekt zur
# Verfuegung, das homepi-core[test] installiert hat - ohne pytest_plugins.
homepi = "homepi_core.testing.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homepi_core"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-watcher>=0.4",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "redis>=8.1.0",
]

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config -m 'not integration and not smoke'"
markers = [
    "integration: braucht eine echte Postgres-Instanz (DATABASE_URL)",
    "smoke: spricht mit einer laufenden Instanz (HOMEPI_ZIEL / HOMEPI_BASIS_URL)",
]

[tool.coverage.run]
source = ["homepi_core"]
branch = true
omit = [
    # Beides wird ueber den pytest11-Entry-Point geladen, also BEVOR
    # pytest-cov aktiv ist - coverage kann davon nichts sehen. Gedeckt ist
    # der Code trotzdem: die acht Rauchtests laufen im stack-Job gegen eine
    # echte Instanz.
    #
    # Aus demselben Grund meldet ziel.py rund 72%, obwohl test_ziel.py jede
    # Verzweigung abdeckt: die Importzeilen laufen vor der Messung. Es bleibt
    # sichtbar statt in omit, damit echte Luecken dort auffallen wuerden.
    "*/homepi_core/testing/plugin.py",
    "*/homepi_core/testing/smoke.py",
]

[tool.coverage.report]
# Die Schwelle steht beim Projekt, nicht in der CI - so gilt sie auch lokal.
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["homepi_core"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# redis ist ein optionales Extra; ohne Installation gibt es keine Stubs.
module = "redis.*"
ignore_missing_imports = true
