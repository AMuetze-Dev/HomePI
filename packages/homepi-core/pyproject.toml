[project]
name = "homepi-core"
version = "0.1.0"
description = "Grundgerüst für HomePI-Microservices: Konfiguration, Logging, Health, Fehlerformat, Deploy-CLI"
requires-python = ">=3.12"
readme = "README.md"

# Bewusst schlank gehalten. Die CLI kommt mit argparse aus der Standard-
# bibliothek aus - ein Service, der nur deployen will, zieht sich kein Typer
# und kein Click herein.
dependencies = [
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
]

[project.optional-dependencies]
# Nur Services, die wirklich einen Cache brauchen.
cache = ["redis>=5.2"]

[project.scripts]
homepi = "homepi_core.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homepi_core"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-watcher>=0.4",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "redis>=8.1.0",
]

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config -m 'not integration'"
markers = [
    "integration: braucht eine echte Postgres-Instanz (DATABASE_URL)",
]

[tool.coverage.run]
source = ["homepi_core"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["homepi_core"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# redis ist ein optionales Extra; ohne Installation gibt es keine Stubs.
module = "redis.*"
ignore_missing_imports = true
