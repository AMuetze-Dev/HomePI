name: core

# Traefik wird bewusst komplett ueber Flags konfiguriert und nicht ueber eine
# traefik.yml: Traefik ersetzt in der statischen Config-Datei KEINE Umgebungs-
# variablen, Docker Compose dagegen schon. So steht die Domain nur in der .env.

services:
  traefik:
    # Mindestens v3.6. Docker 29 nimmt keine API-Version unter 1.40 mehr an,
    # und Traefik bis v3.5 fragt mit 1.24 an, statt auszuhandeln. Er laeuft
    # dann scheinbar gesund (healthy, Port offen), findet aber keinen einzigen
    # Container - jede Adresse antwortet mit 404.
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --api.dashboard=true
      - --ping=true
      - --log.level=INFO
      - --accesslog=true

      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true

      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=dns
      # NUR das Wildcard, nicht zusaetzlich die nackte Domain.
      #
      # Fuer "${DOMAIN}" und "*.${DOMAIN}" verlangt Let's Encrypt ZWEI
      # TXT-Eintraege unter demselben Namen _acme-challenge.${DOMAIN}.
      # DuckDNS kann je Domain nur einen halten - der zweite ueberschreibt
      # den ersten, und die Ausstellung scheitert mit einer Meldung, die
      # nach einem Netzproblem aussieht.
      #
      # Gebraucht wird die nackte Domain ohnehin nicht: Es gibt Router fuer
      # app., api., traefik., logs. und status., alle unter dem Wildcard.
      # Wer sie doch braucht (und einen Anbieter mit mehreren TXT-Eintraegen
      # nutzt), ergaenzt hier ".sans=${DOMAIN}".
      - --entrypoints.websecure.http.tls.domains[0].main=*.${DOMAIN}
      - --entrypoints.websecure.http.middlewares=secure-headers@file

      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=edge
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true

      # Der Resolver heisst "dns" und nicht nach seinem Anbieter: Welcher es
      # ist, steht in ACME_DNS_PROVIDER. Haette er den Anbieternamen, muesste
      # man beim Wechsel auch jeden Router anfassen.
      - --certificatesresolvers.dns.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.dns.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.dns.acme.dnschallenge=true
      - --certificatesresolvers.dns.acme.dnschallenge.provider=${ACME_DNS_PROVIDER}
      # NICHT Pi-hole als Resolver: sonst Henne-Ei bei Zertifikatserneuerung
      - --certificatesresolvers.dns.acme.dnschallenge.resolvers=1.1.1.1:53,9.9.9.9:53
    environment:
      TZ: ${TZ}
      # Beide Anbieter nebeneinander. Die Bibliothek in Traefik liest nur die
      # Variablen des gewaehlten Anbieters; die andere bleibt leer und stoert
      # nicht. So kostet ein Wechsel eine Zeile in der .env statt einer
      # Aenderung an dieser Datei.
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    extra_hosts:
      # damit Traefik das host-genetzte Home Assistant auf :8123 erreicht
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dynamic:/etc/traefik/dynamic:ro
      - ${DATA_ROOT}/traefik/letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: "Host(`traefik.${DOMAIN}`)"
      traefik.http.routers.dashboard.entrypoints: "websecure"
      traefik.http.routers.dashboard.service: "api@internal"
      traefik.http.routers.dashboard.middlewares: "lan-only@file,traefik-auth"
      traefik.http.middlewares.traefik-auth.basicauth.users: "${TRAEFIK_BASIC_AUTH}"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Live-Logs aller Container im Browser, ersetzt "docker logs -f" per SSH
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
    labels:
      traefik.enable: "true"
      traefik.http.routers.dozzle.rule: "Host(`logs.${DOMAIN}`)"
      traefik.http.routers.dozzle.entrypoints: "websecure"
      traefik.http.routers.dozzle.middlewares: "lan-only@file"
      traefik.http.services.dozzle.loadbalancer.server.port: "8080"

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT}/uptime-kuma:/app/data
    networks:
      - edge
    labels:
      traefik.enable: "true"
      traefik.http.routers.kuma.rule: "Host(`status.${DOMAIN}`)"
      traefik.http.routers.kuma.entrypoints: "websecure"
      traefik.http.routers.kuma.middlewares: "lan-only@file"
      traefik.http.services.kuma.loadbalancer.server.port: "3001"

networks:
  edge:
    external: true
