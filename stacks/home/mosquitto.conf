listener 1883
# Fuer den Start: anonymer Zugang nur aus dem LAN (per UFW begrenzt).
# Sobald mehr als HA und Zigbee2MQTT mitreden, auf Passwortdatei umstellen:
#   docker exec -it mosquitto mosquitto_passwd -c /mosquitto/config/passwd ha
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
