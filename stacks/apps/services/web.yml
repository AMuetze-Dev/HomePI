# Die Huelle. Statische Dateien hinter nginx - rund 15 MB, unabhaengig davon,
# wie viele Artefakte es gibt.
services:
  web:
    image: ${WEB_IMAGE}
    container_name: web
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    networks:
      - edge
    labels:
      traefik.enable: "true"
      traefik.http.routers.web.rule: "Host(`app.${DOMAIN}`)"
      traefik.http.routers.web.entrypoints: "websecure"
      traefik.http.services.web.loadbalancer.server.port: "80"
      # Aus dem Internet ueber Tailscale Funnel - docs/14-internet.md. Ohne
      # Host-Regel: Auf den Eingang "funnel" kommt nur, was Tailscale auf dem
      # Pi weiterreicht, und dessen Name (<pi>.<tailnet>.ts.net) steht in
      # keiner Datei dieses Repos.
      traefik.http.routers.funnel-web.rule: "PathPrefix(`/`)"
      traefik.http.routers.funnel-web.entrypoints: "funnel"
      traefik.http.routers.funnel-web.service: "web"
    healthcheck:
      # 127.0.0.1 und nicht "localhost": Im Container loest der Name zuerst
      # auf ::1 auf, nginx horcht aber nur auf 0.0.0.0:80. Das busybox-wget
      # probiert keine zweite Adresse - es meldet "Connection refused", und
      # der Container gilt dauerhaft als krank, obwohl er tadellos
      # ausliefert.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  edge:
    external: true
