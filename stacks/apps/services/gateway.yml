# Das Gateway. Ein Prozess fuer alle Artefakte, die als Modul laufen -
# Begruendung in docs/06-artefakte.md.
services:
  gateway:
    image: ${GATEWAY_IMAGE}
    container_name: gateway
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      SERVICE_NAME: gateway
      ENVIRONMENT: produktion
      LOG_LEVEL: info
      # Ein Worker. Jeder weitere kostet auf dem Pi rund 120 MB, ohne bei
      # I/O-gebundener Last etwas zu bringen.
      WEB_CONCURRENCY: 1
      # Service Discovery ist Docker-DNS: "postgres" ist der Containername
      # im Netz "data".
      DATABASE_URL: postgresql+asyncpg://app:${APP_DB_PASSWORD}@postgres:5432/app
      CORS_ORIGINS: https://app.${DOMAIN}
      # In Produktion aus: ein Schema aendert man mit einer Migration, nicht
      # beim Start. Siehe docs/04-runbook.md.
      DB_SCHEMA_ANLEGEN: "false"
    networks:
      - edge
      - data
    labels:
      traefik.enable: "true"
      # Die Website ruft ihre API unter DERSELBEN Adresse auf, unter
      # /api - im LAN unter app.<domain>, aus dem Internet unter dem
      # ts.net-Namen des Funnels. Ein fester Name im Bundle liefe unter dem
      # jeweils anderen ins Leere. Dazu kein CORS: Seite und API haben einen
      # Ursprung.
      #
      # Die laengere Regel gewinnt in Traefik von selbst - /api schlaegt
      # damit den Router der Website, die Anmeldung wiederum /api.
      traefik.http.routers.app-api.rule: "Host(`app.${DOMAIN}`) && PathPrefix(`/api`)"
      traefik.http.routers.app-api.entrypoints: "websecure"
      traefik.http.routers.app-api.middlewares: "api-praefix@file,rate-limit@file"
      traefik.http.routers.app-api.service: "gateway"
      # Die Anmeldung bekommt eine eigene, enge Bremse je Adresse. Sie sitzt
      # VOR dem Gateway: Das Gateway sperrt einen Namen nach fuenf
      # Fehlversuchen, erfaehrt aber nicht, wer von wo wie viele Namen
      # durchprobiert. Das sieht nur der Reverse Proxy.
      traefik.http.routers.app-anmelden.rule: "Host(`app.${DOMAIN}`) && Path(`/api/auth/anmelden`)"
      traefik.http.routers.app-anmelden.entrypoints: "websecure"
      traefik.http.routers.app-anmelden.middlewares: "api-praefix@file,anmelde-bremse@file"
      traefik.http.routers.app-anmelden.service: "gateway"

      # Dasselbe aus dem Internet, ueber Tailscale Funnel. Eigene Bremsen,
      # die die Adresse aus X-Forwarded-For lesen - siehe
      # middlewares.yml.tmpl, "rate-limit-funnel".
      traefik.http.routers.funnel-api.rule: "PathPrefix(`/api`)"
      traefik.http.routers.funnel-api.entrypoints: "funnel"
      traefik.http.routers.funnel-api.middlewares: "api-praefix@file,rate-limit-funnel@file"
      traefik.http.routers.funnel-api.service: "gateway"
      traefik.http.routers.funnel-anmelden.rule: "Path(`/api/auth/anmelden`)"
      traefik.http.routers.funnel-anmelden.entrypoints: "funnel"
      traefik.http.routers.funnel-anmelden.middlewares: "api-praefix@file,anmelde-bremse-funnel@file"
      traefik.http.routers.funnel-anmelden.service: "gateway"

      # api.<domain> bleibt - fuer die Rauchtests (homepi.toml) und fuer
      # Werkzeuge im LAN. Aus dem Internet braucht es niemand mehr, also
      # haengt es nur am LAN-Eingang.
      traefik.http.routers.gateway.rule: "Host(`api.${DOMAIN}`)"
      traefik.http.routers.gateway.entrypoints: "websecure"
      traefik.http.routers.gateway.middlewares: "api-cors@file,rate-limit@file"
      traefik.http.services.gateway.loadbalancer.server.port: "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        # 127.0.0.1 und nicht "localhost". Uvicorn horcht auf 0.0.0.0:8000,
        # also nur IPv4; "localhost" zeigt im Container zuerst auf ::1.
        # urllib probiert zwar die zweite Adresse - aber eine Pruefung, die
        # vom Rueckfallverhalten des Namensauflösers abhaengt, faellt beim
        # naechsten Basis-Image um. Beim web-Dienst ist genau das passiert.
        - import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  edge:
    external: true
  data:
    external: true
