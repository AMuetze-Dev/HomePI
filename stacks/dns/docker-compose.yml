name: dns

services:
  pihole:
    # Nach der ersten erfolgreichen Installation auf den konkreten Tag pinnen,
    # z.B. pihole/pihole:2025.08.0 - "latest" macht bei Major-Upgrades Ueberraschungen.
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole
    restart: unless-stopped
    ports:
      # Das Einzige, was Pi-hole wirklich auf dem Host braucht:
      - "53:53/tcp"
      - "53:53/udp"
      # Notausgang, falls Traefik nicht laeuft und du DNS reparieren musst.
      # Der regulaere Weg ist https://pihole.${DOMAIN}
      - "8080:80/tcp"
      # DHCP bleibt im Router. Falls doch gewuenscht: NET_ADMIN + diese Zeile.
      # - "67:67/udp"
    environment:
      TZ: ${TZ}
      # --- Pi-hole v6 Konfiguration (FTLCONF_<config-pfad>) ---
      # Bei v5 heissen die Variablen anders (WEBPASSWORD, PIHOLE_DNS_, ...).
      # Falls dein Image v5 ist, siehe Kommentarblock unten.
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_webserver_port: "80"
      FTLCONF_dns_upstreams: ${PIHOLE_UPSTREAMS}
      # "all": auch Anfragen aus anderen Subnetzen/Docker-Netzen beantworten
      FTLCONF_dns_listeningMode: all
      FTLCONF_dns_dnssec: "true"
    volumes:
      - ${DATA_ROOT}/pihole/etc-pihole:/etc/pihole
    cap_add:
      - SYS_NICE          # FTL setzt seine eigene Prioritaet
      # - NET_ADMIN       # nur noetig, wenn Pi-hole DHCP macht
    networks:
      - edge
    labels:
      traefik.enable: "true"
      traefik.http.routers.pihole.rule: "Host(`pihole.${DOMAIN}`)"
      traefik.http.routers.pihole.entrypoints: "websecure"
      traefik.http.routers.pihole.middlewares: "lan-only@file,pihole-admin"
      traefik.http.services.pihole.loadbalancer.server.port: "80"
      # Pi-hole erwartet die UI unter /admin - Root-Aufruf dorthin umleiten
      traefik.http.middlewares.pihole-admin.redirectregex.regex: "^https://pihole\\.${DOMAIN}/?$$"
      traefik.http.middlewares.pihole-admin.redirectregex.replacement: "https://pihole.${DOMAIN}/admin/"
    healthcheck:
      test: ["CMD", "dig", "+short", "+norecurse", "+retry=0", "@127.0.0.1", "pi.hole"]
      interval: 30s
      timeout: 5s
      retries: 3

# --- Falls das Image noch Pi-hole v5 ist, diesen environment-Block nehmen: ---
#     environment:
#       TZ: ${TZ}
#       WEBPASSWORD: ${PIHOLE_PASSWORD}
#       PIHOLE_DNS_: ${PIHOLE_UPSTREAMS}
#       DNSMASQ_LISTENING: all
#       DNSSEC: "true"
#     volumes:
#       - ${DATA_ROOT}/pihole/etc-pihole:/etc/pihole
#       - ${DATA_ROOT}/pihole/etc-dnsmasq.d:/etc/dnsmasq.d

networks:
  edge:
    external: true
