name: dns

services:
  pihole:
    # Fester Tag, kein "latest": Dieser Container ist das DNS der ganzen
    # Wohnung. Ein Major-Upgrade, das beim naechsten "docker compose pull"
    # unangekuendigt mitkommt, legt im Zweifel das Netz lahm - und zwar so,
    # dass die Fehlersuche selbst kein DNS mehr hat.
    #
    # Angelernt am 19.10.2026 mit Core v6.5 / Web v6.6.1 / FTL v6.8.
    # Hochziehen heisst: Tag aendern, pull, up -d, danach "dig @127.0.0.1
    # example.com" und eine geblockte Domain pruefen.
    image: pihole/pihole:2026.10.0
    container_name: pihole
    hostname: pihole
    restart: unless-stopped
    ports:
      # Das Einzige, was Pi-hole wirklich auf dem Host braucht:
      - "53:53/tcp"
      - "53:53/udp"
      # Notausgang, falls Traefik nicht laeuft und du DNS reparieren musst.
      # Der regulaere Weg ist https://pihole.${DOMAIN}
      - "8080:80/tcp"
      # DHCP bleibt im Router. Falls doch gewuenscht: NET_ADMIN + diese Zeile.
      # - "67:67/udp"
    environment:
      TZ: ${TZ}
      # --- Pi-hole v6 Konfiguration (FTLCONF_<config-pfad>) ---
      # Bei v5 heissen die Variablen anders (WEBPASSWORD, PIHOLE_DNS_, ...).
      # Falls dein Image v5 ist, siehe Kommentarblock unten.
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_webserver_port: "80"
      FTLCONF_dns_upstreams: ${PIHOLE_UPSTREAMS}
      # "all": auch Anfragen aus anderen Subnetzen/Docker-Netzen beantworten
      FTLCONF_dns_listeningMode: all
      FTLCONF_dns_dnssec: "true"
      # Die eigene Domain samt ALLEN Unternamen zeigt im LAN auf den Pi -
      # egal, was das oeffentliche DNS sagt. Ohne das ginge nach dem
      # Umstellen auf die oeffentliche Adresse (docs/14-internet.md) jeder
      # Aufruf aus dem Wohnzimmer erst zum Router und zurueck, landete dort
      # am Internet-Eingang - und Dashboard, Logs und Home Assistant waeren
      # im eigenen Netz nicht mehr erreichbar.
      #
      # Nebenbei erledigt das die Fritz!Box-Falle aus docs/03: Fragt das LAN
      # Pi-hole, kommt die Antwort nie beim DNS-Rebind-Schutz des Routers an.
      FTLCONF_misc_dnsmasq_lines: "address=/${DOMAIN}/${PI_IP}"
    volumes:
      - ${DATA_ROOT}/pihole/etc-pihole:/etc/pihole
    cap_add:
      - SYS_NICE          # FTL setzt seine eigene Prioritaet
      # - NET_ADMIN       # nur noetig, wenn Pi-hole DHCP macht
    networks:
      - edge
    labels:
      traefik.enable: "true"
      traefik.http.routers.pihole.rule: "Host(`pihole.${DOMAIN}`)"
      traefik.http.routers.pihole.entrypoints: "websecure"
      traefik.http.routers.pihole.middlewares: "lan-only@file,pihole-admin"
      traefik.http.services.pihole.loadbalancer.server.port: "80"
      # Pi-hole erwartet die UI unter /admin - Root-Aufruf dorthin umleiten
      traefik.http.middlewares.pihole-admin.redirectregex.regex: "^https://pihole\\.${DOMAIN}/?$$"
      traefik.http.middlewares.pihole-admin.redirectregex.replacement: "https://pihole.${DOMAIN}/admin/"
    healthcheck:
      test: ["CMD", "dig", "+short", "+norecurse", "+retry=0", "@127.0.0.1", "pi.hole"]
      interval: 30s
      timeout: 5s
      retries: 3

# --- Falls das Image noch Pi-hole v5 ist, diesen environment-Block nehmen: ---
#     environment:
#       TZ: ${TZ}
#       WEBPASSWORD: ${PIHOLE_PASSWORD}
#       PIHOLE_DNS_: ${PIHOLE_UPSTREAMS}
#       DNSMASQ_LISTENING: all
#       DNSSEC: "true"
#     volumes:
#       - ${DATA_ROOT}/pihole/etc-pihole:/etc/pihole
#       - ${DATA_ROOT}/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
  # Haelt den DuckDNS-Eintrag auf der oeffentlichen Adresse des
  # Anschlusses. Nur mit "--profile internet" (make up-internet): Ohne
  # Portfreigabe am Router zeigte der Name sonst ins Leere, und die Wohnung
  # verloere den Namen, den sie im LAN benutzt - der kommt dann aber ohnehin
  # aus Pi-hole (siehe FTLCONF_misc_dnsmasq_lines oben).
  #
  # Ein curl in einer Schleife und kein fertiges Updater-Abbild: Das ist
  # die ganze Aufgabe, und so steht sie lesbar hier. "ip=" leer laesst
  # DuckDNS die Absenderadresse nehmen - genau die, die von aussen sichtbar
  # ist. Ausgegeben wird nur DuckDNS' Antwort ("OK"/"KO"), nie die Adresse
  # mit dem Token darin.
  duckdns:
    image: curlimages/curl:8.11.1
    container_name: duckdns
    restart: unless-stopped
    profiles: ["internet"]
    environment:
      DOMAIN: ${DOMAIN}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        name="$${DOMAIN%.duckdns.org}"
        while true; do
          antwort=$$(curl -fsS --max-time 20 "https://www.duckdns.org/update?domains=$${name}&token=$${DUCKDNS_TOKEN}&ip=" || echo "keine Antwort")
          echo "$$(date -Iseconds) DuckDNS $${name}: $${antwort}"
          sleep 300
        done

networks:
  edge:
    external: true
