name: apps

services:
  api:
    image: ${API_IMAGE}
    # Fuer lokalen Build auf dem Pi stattdessen:
    # build: { context: ./api }
    container_name: api
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      # Service Discovery = Docker-DNS. "postgres" und "redis" sind die
      # Container-Namen im Netz "data". Kein Eureka noetig.
      DATABASE_URL: postgresql+asyncpg://app:${APP_DB_PASSWORD}@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: https://app.${DOMAIN}
      LOG_LEVEL: info
    networks:
      - edge      # damit Traefik drankommt
      - data      # damit die DB drankommt
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: "Host(`api.${DOMAIN}`)"
      traefik.http.routers.api.entrypoints: "websecure"
      traefik.http.routers.api.middlewares: "api-cors@file,rate-limit@file"
      traefik.http.services.api.loadbalancer.server.port: "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: ${WEB_IMAGE}
    # build: { context: ./web }
    container_name: web
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    networks:
      - edge
    labels:
      traefik.enable: "true"
      traefik.http.routers.web.rule: "Host(`app.${DOMAIN}`)"
      traefik.http.routers.web.entrypoints: "websecure"
      traefik.http.services.web.loadbalancer.server.port: "80"

  # --------------------------------------------------------------------------
  # Eureka - bewusst deaktiviert. Begruendung in docs/03-architecture.md.
  # Kurz: Docker-DNS loest Service Discovery auf einem Host bereits, Traefik ist
  # das Gateway. Eureka kostet hier eine JVM und einen zweiten Mechanismus.
  # Aktiviere es nur, wenn du Spring Cloud bewusst lernen willst.
  # --------------------------------------------------------------------------
  # eureka:
  #   image: steeltoeoss/eureka-server:latest
  #   container_name: eureka
  #   restart: unless-stopped
  #   environment:
  #     TZ: ${TZ}
  #     EUREKA_CLIENT_REGISTERWITHEUREKA: "false"
  #     EUREKA_CLIENT_FETCHREGISTRY: "false"
  #     JAVA_OPTS: "-Xms128m -Xmx384m"
  #   networks: [edge, data]
  #   labels:
  #     traefik.enable: "true"
  #     traefik.http.routers.eureka.rule: "Host(`eureka.${DOMAIN}`)"
  #     traefik.http.routers.eureka.entrypoints: "websecure"
  #     traefik.http.routers.eureka.middlewares: "lan-only@file"
  #     traefik.http.services.eureka.loadbalancer.server.port: "8761"

networks:
  edge:
    external: true
  data:
    external: true
