server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip reicht; brotli braucht ein nginx-Modul, das im Alpine-Image fehlt
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # gehashte Assets duerfen ewig im Cache liegen
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: jede unbekannte Route geht an den Router im Client
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html selbst nie cachen, sonst siehst du Deployments nicht
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
