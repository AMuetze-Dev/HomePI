name: home

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    # Pflicht: ohne Host-Netz findet HA per mDNS/Broadcast keine Geraete.
    # Folge: Port 8123 gehoert dem Host, Traefik routet ueber den File-Provider
    # (core/dynamic/homeassistant.yml) auf host.docker.internal:8123.
    network_mode: host
    privileged: true
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT}/homeassistant:/config
      - /run/dbus:/run/dbus:ro          # Bluetooth-Integration
      - /etc/localtime:/etc/localtime:ro
    # USB-Sticks (Zigbee/Z-Wave) erst eintragen, wenn sie da sind.
    # Immer den stabilen by-id-Pfad nehmen, nicht /dev/ttyUSB0 - die Nummer wandert.
    # devices:
    #   - /dev/serial/by-id/usb-XXXX:/dev/ttyUSB0

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    environment:
      TZ: ${TZ}
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${DATA_ROOT}/mosquitto/data:/mosquitto/data
      - ${DATA_ROOT}/mosquitto/log:/mosquitto/log
    networks:
      - edge

  # Zigbee erst aktivieren, wenn der Coordinator-Stick da ist.
  # zigbee2mqtt:
  #   image: koenkk/zigbee2mqtt:latest
  #   container_name: zigbee2mqtt
  #   restart: unless-stopped
  #   depends_on: [mosquitto]
  #   environment:
  #     TZ: ${TZ}
  #   volumes:
  #     - ${DATA_ROOT}/zigbee2mqtt:/app/data
  #     - /run/udev:/run/udev:ro
  #   devices:
  #     - /dev/serial/by-id/usb-XXXX:/dev/ttyACM0
  #   networks: [edge]
  #   labels:
  #     traefik.enable: "true"
  #     traefik.http.routers.z2m.rule: "Host(`zigbee.${DOMAIN}`)"
  #     traefik.http.routers.z2m.entrypoints: "websecure"
  #     traefik.http.routers.z2m.middlewares: "lan-only@file"
  #     traefik.http.services.z2m.loadbalancer.server.port: "8080"

networks:
  edge:
    external: true
