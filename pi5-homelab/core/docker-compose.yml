name: core

# Traefik wird bewusst komplett ueber Flags konfiguriert und nicht ueber eine
# traefik.yml: Traefik ersetzt in der statischen Config-Datei KEINE Umgebungs-
# variablen, Docker Compose dagegen schon. So steht die Domain nur in der .env.

services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --api.dashboard=true
      - --ping=true
      - --log.level=INFO
      - --accesslog=true

      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true

      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=cloudflare
      - --entrypoints.websecure.http.tls.domains[0].main=${DOMAIN}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${DOMAIN}
      - --entrypoints.websecure.http.middlewares=secure-headers@file

      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=edge
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true

      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      # NICHT Pi-hole als Resolver: sonst Henne-Ei bei Zertifikatserneuerung
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,9.9.9.9:53
    environment:
      TZ: ${TZ}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    extra_hosts:
      # damit Traefik das host-genetzte Home Assistant auf :8123 erreicht
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dynamic:/etc/traefik/dynamic:ro
      - ${DATA_ROOT}/traefik/letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: "Host(`traefik.${DOMAIN}`)"
      traefik.http.routers.dashboard.entrypoints: "websecure"
      traefik.http.routers.dashboard.service: "api@internal"
      traefik.http.routers.dashboard.middlewares: "lan-only@file,traefik-auth"
      traefik.http.middlewares.traefik-auth.basicauth.users: "${TRAEFIK_BASIC_AUTH}"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Live-Logs aller Container im Browser, ersetzt "docker logs -f" per SSH
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
    labels:
      traefik.enable: "true"
      traefik.http.routers.dozzle.rule: "Host(`logs.${DOMAIN}`)"
      traefik.http.routers.dozzle.entrypoints: "websecure"
      traefik.http.routers.dozzle.middlewares: "lan-only@file"
      traefik.http.services.dozzle.loadbalancer.server.port: "8080"

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT}/uptime-kuma:/app/data
    networks:
      - edge
    labels:
      traefik.enable: "true"
      traefik.http.routers.kuma.rule: "Host(`status.${DOMAIN}`)"
      traefik.http.routers.kuma.entrypoints: "websecure"
      traefik.http.routers.kuma.middlewares: "lan-only@file"
      traefik.http.services.kuma.loadbalancer.server.port: "3001"

networks:
  edge:
    external: true
