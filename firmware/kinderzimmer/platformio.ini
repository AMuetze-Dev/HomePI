; Firmware des Spielgeraets fuer das Artefakt "kinderzimmer".
;
;   pio test -e native   Spiellogik auf dem PC pruefen (Unity, ohne Board)
;   pio run              fuer das Board bauen
;   pio run -t upload    flashen, ueber die Buchse "UART" des DevKitC
;
; Die Spiellogik liegt in lib/logik und kennt kein Arduino. Nur deshalb
; laufen ihre Tests auf dem PC in Sekunden. src/ ist die duenne Schicht, die
; Knoepfe, NFC, Licht, Ton, Flash und WLAN an diese Logik anschliesst.

[platformio]
default_envs = esp32s3

[common]
lib_deps =
    bblanchon/ArduinoJson@7.2.1

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
; N16R8: 16 MB Quad-Flash, 8 MB Octal-PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
build_unflags = -std=gnu++11
build_src_flags = -Wall
lib_deps =
    ${common.lib_deps}
    adafruit/Adafruit NeoPixel@1.12.3
    adafruit/Adafruit PN532@1.3.4
    adafruit/Adafruit BusIO@1.17.4
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Tests laufen nur nativ.
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
lib_deps = ${common.lib_deps}
