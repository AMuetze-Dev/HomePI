[project]
name = "homepi-staffelpilot"
version = "0.1.0"
description = "HomePI-Artefakt: StaffelPilot"
requires-python = ">=3.12"
dependencies = [
    "homepi-core",
    # Fuer die DFBnet-Zugangsdaten: sie liegen verschluesselt in der
    # Datenbank, der Schluessel steht in der Umgebung.
    "cryptography>=44",
    # Fuer das Mahnungsformular: der Vordruck des Verbandes ist ein AcroForm,
    # und seine Felder werden gefuellt -- nicht an geratenen Koordinaten
    # ueberdruckt.
    "pypdf>=5.1",
    # Fuer die Textvorlagen der Schreiben. Sie liegen als YAML, damit sie
    # lesbar bleiben: wer einen Satz aendern will, soll keinen Python-Code
    # anfassen muessen.
    "pyyaml>=6.0",
]

# Die ganze Anmeldung. Das Gateway findet das Modul beim Start hierueber -
# ein Tippfehler in dieser Zeile heisst: die Kachel fehlt.
[project.entry-points."homepi.module"]
staffelpilot = "homepi_staffelpilot:modul"

[tool.homepi]
service = "staffelpilot"

[tool.uv.sources]
homepi-core = { path = "../../packages/homepi-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homepi_staffelpilot"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-watcher>=0.4",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config -m 'not integration and not smoke'"
markers = [
    "integration: braucht eine echte Postgres-Instanz",
    "smoke: spricht mit einer laufenden Instanz",
]

# Die Schwelle steht beim Projekt, nicht in der CI - so gilt sie auch lokal.
[tool.coverage.report]
fail_under = 85

[tool.coverage.run]
source = ["homepi_staffelpilot"]
branch = true
# SQLAlchemys asyncio-Schicht setzt Koroutinen in einem Greenlet fort. Ohne
# diese Zeile verliert coverage dort die Spur: die Zeile *nach* jedem `await`
# gilt als nie ausgefuehrt, obwohl der Test sie nachweislich durchlaeuft.
# Gemessen: speicher.py sprang damit von 47 % auf einen plausiblen Wert, ohne
# dass ein einziger Test dazukam.
#
# Das ist keine gesenkte Schwelle, sondern eine richtige Messung.
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["homepi_staffelpilot"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
