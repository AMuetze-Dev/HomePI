[project]
name = "homepi-haushaltsbuch"
version = "0.1.0"
description = "HomePI-Artefakt: Haushaltsbuch"
requires-python = ">=3.12"
dependencies = ["homepi-core"]

# Die ganze Anmeldung. Das Gateway findet das Modul beim Start hierueber -
# ein Tippfehler in dieser Zeile heisst: die Kachel fehlt.
[project.entry-points."homepi.module"]
haushaltsbuch = "homepi_haushaltsbuch:modul"

[tool.homepi]
service = "haushaltsbuch"

[tool.uv.sources]
homepi-core = { path = "../../packages/homepi-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homepi_haushaltsbuch"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-watcher>=0.4",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config -m 'not integration and not smoke'"
markers = [
    "integration: braucht eine echte Postgres-Instanz",
    "smoke: spricht mit einer laufenden Instanz",
]

# Die Schwelle steht beim Projekt, nicht in der CI - so gilt sie auch lokal.
[tool.coverage.report]
fail_under = 85

[tool.coverage.run]
source = ["homepi_haushaltsbuch"]
branch = true
# SQLAlchemys asyncio-Schicht setzt Koroutinen in einem Greenlet fort. Ohne
# diese Zeile verliert coverage dort die Spur: die Zeile *nach* jedem `await`
# gilt als nie ausgefuehrt, obwohl der Test sie nachweislich durchlaeuft.
# Hier sprang speicher.py damit von 51 % auf einen plausiblen Wert, ohne
# dass ein einziger Test dazukam -- dieselbe Falle wie bei staffelpilot.
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["homepi_haushaltsbuch"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
