[project]
name = "homepi-geraete"
version = "0.1.0"
description = "HomePI-Artefakt: Geraete im Haus"
requires-python = ">=3.12"
dependencies = ["homepi-core"]

# Das ist die ganze Anmeldung. Das Gateway findet das Modul beim Start,
# haengt den Router unter /geraete ein und nennt es in GET /module.
[project.entry-points."homepi.module"]
geraete = "homepi_geraete:modul"

[tool.homepi]
service = "geraete"

[tool.uv.sources]
homepi-core = { path = "../../packages/homepi-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homepi_geraete"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-watcher>=0.4",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config -m 'not integration and not smoke'"
markers = [
    "integration: braucht eine echte Postgres-Instanz",
    "smoke: spricht mit einer laufenden Instanz",
]

[tool.coverage.run]
source = ["homepi_geraete"]
branch = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["homepi_geraete"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
